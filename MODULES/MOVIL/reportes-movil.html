<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes – App Móvil</title>
<link rel="stylesheet" href="../../ASSETS/CSS/main.css">
<link rel="stylesheet" href="../../ASSETS/CSS/movil.css">
</head>
<body>

<div class="movil-fondo">
  <div class="telefono">
    <div class="movil-header">
      <div class="telefono-statusbar telefono-statusbar--claro">
        <span id="horaStatusBar">--:--</span>
        <span class="status-iconos">
          <svg width="15" height="11" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5c5-5 13-5 18 0M4 8c3.4-3.2 8.6-3.2 12 0M7.2 11c1.7-1.5 3.9-1.5 5.6 0"/><circle cx="10" cy="12.5" r="1"/></svg>
          <svg width="20" height="11" viewBox="0 0 25 13" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="20" height="11" rx="2.5"/><rect x="3" y="3" width="14" height="7" rx="1" fill="currentColor" stroke="none"/><path d="M23 4.5v4" stroke-linecap="round"/></svg>
        </span>
      </div>
      <div class="movil-header-fila">
        <div class="movil-header-titulos">
          <div class="movil-header-titulo">Reportes</div>
        </div>
      </div>
    </div>

    <div class="movil-contenido">

      <!-- PERÍODO ACTIVO — mismo id que "Generar Reporte" (data-gastos.js
           primerYUltimoDiaDelMes, corte 10→09), inicializarGastosMovil lo
           llena si el elemento existe. -->
      <div class="gastos-periodo-box">
        <span class="gastos-periodo-label">Período activo</span>
        <span class="gastos-periodo-rango" id="gastosPeriodoRango">—</span>
      </div>

      <div class="movil-tab-toggle" id="reportesTabs">
        <button type="button" class="movil-tab-toggle-btn activo" id="btnTabReportesMovilidad" onclick="cambiarTabReportes('Movilidad')">Movilidad</button>
        <button type="button" class="movil-tab-toggle-btn" id="btnTabReportesAlimentos" onclick="cambiarTabReportes('Alimentos')">Alimentos</button>
        <button type="button" class="movil-tab-toggle-btn" id="btnTabReportesDiasBordo" onclick="cambiarTabReportes('Días a Bordo')">Días a Bordo</button>
      </div>

      <div id="reportesAccordion"></div>
      <p class="gastos-total-acumulado" id="reportesTotalGeneral"></p>

      <!-- DESCARGA: valida huella (simulado) y recién ahí genera el archivo
           con descarga-gastos.js — mismo formato y marca de agua que ve el
           supervisor en la web. El operador lo sube él mismo a su otro
           aplicativo. -->
      <div class="reportes-descarga-botones">
        <button type="button" class="btn-accion btn-guardar" onclick="iniciarDescargaReporte('excel')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar Excel
        </button>
        <button type="button" class="btn-accion btn-cancelar" onclick="iniciarDescargaReporte('pdf')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar PDF
        </button>
      </div>
    </div>

    <div class="movil-bottomnav">
      <a class="movil-nav-item" href="operaciones-movil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Operaciones
      </a>
      <a class="movil-nav-item" href="gastos-movil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Generar Reporte
      </a>
      <a class="movil-nav-item activo" href="reportes-movil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Reportes
      </a>
      <a class="movil-nav-item" href="perfil-movil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </a>
    </div>

    <!-- MODAL: VALIDAR HUELLA — simulado (igual que la geolocalización
         simulada de Operaciones): sin hardware real, solo un estado de
         carga breve antes de confirmar. -->
    <div class="modal-overlay movil-modal-overlay" id="modalValidarHuella">
      <div class="modal modal-sm">
        <div class="modal-body modal-huella-body">
          <div class="huella-icono" id="huellaIcono">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 11c0 3.5-1.5 6.5-3 8.5M6.5 18c1-2 1.5-4 1.5-6a4 4 0 0 1 8 0c0 1 0 2-.5 3.5M9 20.5a16 16 0 0 0 1.5-6.5 1.5 1.5 0 0 1 3 0c0 2-.5 4-1 5.5M12.5 6.5a7 7 0 0 1 7 7c0 1.5-.2 2.5-.5 3.5M4.5 15a9 9 0 0 1 .5-8.5M8 4.2A9 9 0 0 1 21 11.5"/></svg>
          </div>
          <p class="huella-texto" id="huellaEstadoTexto">Coloca tu huella en el sensor…</p>
        </div>
      </div>
    </div>

    <!-- MODAL: REGISTRAR/EDITAR ALIMENTOS — mismo modal que "Generar
         Reporte" (duplicado): "Editar" desde el acordeón de esta página
         abre este modal, respaldado por las mismas funciones de
         gastos-movil.js. -->
    <div class="modal-overlay movil-modal-overlay" id="modalRegistrarAlimentos">
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2 class="modal-title" id="tituloRegistrarAlimentos">Registrar Alimentos</h2>
          <button class="modal-close" onclick="cerrarModal('modalRegistrarAlimentos')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="movil-form-group">
            <label class="movil-form-label">Comida</label>
            <select class="movil-input" id="alimentosComida" style="padding-left:14px;">
              <option value="Desayuno">Desayuno</option>
              <option value="Almuerzo">Almuerzo</option>
              <option value="Cena">Cena</option>
            </select>
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Fecha</label>
            <input type="date" class="movil-input" id="alimentosFecha" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Lugar</label>
            <input type="text" class="movil-input" id="alimentosLugar" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Cliente</label>
            <input type="text" class="movil-input" id="alimentosCliente" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Operación / PER</label>
            <input type="text" class="movil-input" id="alimentosOperacionPer" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Hora</label>
            <input type="time" class="movil-input" id="alimentosHora" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Costo (S/)</label>
            <input type="number" step="0.01" class="movil-input" id="alimentosCosto" style="padding-left:14px;" oninput="actualizarTopeAlimentos()">
            <span class="movil-input-contador" id="alimentosTopeTexto"></span>
          </div>
          <label class="gastos-checkbox-row">
            <input type="checkbox" id="alimentosSinSustento" onchange="toggleEvidenciaAlimentos()">
            <span>Gasto sin sustento</span>
          </label>
          <div class="movil-form-group" id="alimentosEvidenciaGroup">
            <label class="movil-form-label">Evidencia (foto)</label>
            <input type="file" accept="image/*" capture="environment" id="alimentosEvidenciaInput" onchange="agregarEvidenciaAlimentos(this)">
            <div class="gastos-evidencia-chips" id="alimentosEvidenciaChips"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-accion btn-cancelar" onclick="cerrarModal('modalRegistrarAlimentos')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            Cancelar
          </button>
          <button class="btn-accion btn-guardar" onclick="guardarGastoAlimentos()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
            Guardar
          </button>
        </div>
      </div>
    </div>

    <!-- MODAL: REGISTRAR/EDITAR MOVILIDAD — mismo modal que "Generar
         Reporte" (duplicado). -->
    <div class="modal-overlay movil-modal-overlay" id="modalRegistrarMovilidad">
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2 class="modal-title" id="tituloRegistrarMovilidad">Registrar Movilidad</h2>
          <button class="modal-close" onclick="cerrarModal('modalRegistrarMovilidad')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="movil-form-group">
            <label class="movil-form-label">Fecha</label>
            <input type="date" class="movil-input" id="movilidadFecha" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Empresa</label>
            <input type="text" class="movil-input" id="movilidadEmpresa" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Distrito de partida</label>
            <input type="text" class="movil-input" id="movilidadDistritoPartida" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Distrito de destino</label>
            <input type="text" class="movil-input" id="movilidadDistritoDestino" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Motivo</label>
            <input type="text" class="movil-input" id="movilidadMotivo" style="padding-left:14px;">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Horas</label>
            <input type="text" class="movil-input" id="movilidadHoras" style="padding-left:14px;" placeholder="Ej. 2 horas">
          </div>
          <div class="movil-form-group">
            <label class="movil-form-label">Importe (S/)</label>
            <input type="number" step="0.01" class="movil-input" id="movilidadImporte" style="padding-left:14px;" oninput="actualizarTopeMovilidad()">
            <span class="movil-input-contador" id="movilidadTopeTexto"></span>
          </div>
          <label class="gastos-checkbox-row">
            <input type="checkbox" id="movilidadSinSustento" onchange="toggleEvidenciaMovilidad()">
            <span>Gasto sin sustento</span>
          </label>
          <div class="movil-form-group" id="movilidadEvidenciaGroup">
            <label class="movil-form-label">Evidencia (foto)</label>
            <input type="file" accept="image/*" capture="environment" id="movilidadEvidenciaInput" onchange="agregarEvidenciaMovilidad(this)">
            <div class="gastos-evidencia-chips" id="movilidadEvidenciaChips"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-accion btn-cancelar" onclick="cerrarModal('modalRegistrarMovilidad')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            Cancelar
          </button>
          <button class="btn-accion btn-guardar" onclick="guardarGastoMovilidad()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../ASSETS/JS/data-usuarios.js"></script>
<script src="../../ASSETS/JS/data-tablas-generales.js"></script>
<script src="../../ASSETS/JS/data-terminal-muelle.js"></script>
<script src="../../ASSETS/JS/data-precintos.js"></script>
<script src="../../ASSETS/JS/data-movil.js"></script>
<script src="../../ASSETS/JS/data-gastos.js"></script>
<script src="../../ASSETS/JS/permisos.js"></script>
<script src="../../ASSETS/JS/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4/dist/exceljs.min.js"></script>
<script src="../../ASSETS/JS/descarga-gastos.js"></script>
<script src="../../ASSETS/JS/gastos-movil.js"></script>
</body>
</html>
